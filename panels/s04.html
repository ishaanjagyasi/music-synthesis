<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waveforms</title><style>html,body{margin:0;height:100%;background:#4b4b4b;overflow:hidden}#root{height:100%}figure{background:#1d1d1d;border-radius:4px}figcaption{position:absolute;left:10px;right:10px;top:8px;display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:#aaa;z-index:1}figcaption b{order:3;font-size:20px;color:#eee;position:absolute;left:0;top:14px}figcaption output{order:2}svg .grid{stroke:#333;fill:none}svg .zero{stroke:#555;stroke-dasharray:3 3;fill:none}svg .curve{stroke:#6aa8ff;stroke-width:1.6;fill:none}svg .curve.sounding{stroke:#ff9a3c}svg .area{fill:#6aa8ff33;stroke:none}svg .area.sounding{fill:#ff9a3c44}svg .mark{fill:#6aa8ff}svg .mark.sounding{fill:#ff9a3c}svg .guide{stroke:#888;stroke-dasharray:2 3;fill:none}svg .tick{fill:#888;font:10px monospace}</style></head><body><div id="root"></div><script type="module">const root = document.getElementById('root');

const css = document.createElement('style');

+ '.al svg .curve{stroke:#4fd1ff!important;stroke-width:2!important;fill:none!important}.al svg .curve.sounding{stroke:#ffa62e!important}.al svg .area{fill:rgba(79,209,255,.24)!important;stroke:none!important}.al svg .area.sounding{fill:rgba(255,166,46,.32)!important}.al svg .mark{fill:#4fd1ff!important}.al svg .mark.sounding{fill:#ffa62e!important}'

const stage = div('al-stage');
function figure(fl) { const f = document.createElement('figure'); f.style.cssText = 'flex:' + (fl || 1) + ' 1 0;margin:0;position:relative;min-height:0;'; f.innerHTML = '<figcaption><span></span><output></output><b></b></figcaption>'; const s = el('svg'); s.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;'; f.append(s); f.cap = f.querySelector('span'); f.out = f.querySelector('output'); f.lead = f.querySelector('b'); f.svg = s; return f; }
function pol(r, a) { return [32 + r * Math.sin(a), 30 - r * Math.cos(a)]; }
function arc(r, a0, a1) { const p = pol(r, a0), q = pol(r, a1); return 'M' + p[0].toFixed(2) + ',' + p[1].toFixed(2) + 'A' + r + ',' + r + ' 0 ' + (a1 - a0 > Math.PI ? 1 : 0) + ' 1 ' + q[0].toFixed(2) + ',' + q[1].toFixed(2); }
const A0 = -2.356, A1 = 2.356;
function bar(name, min, max, step, init, fmt, on) {
  const k = div('al-k'), cap = div('al-cap'), o = div('al-v'), r = document.createElement('input'), s = el('svg', { width: 64, height: 52 });
  cap.textContent = name; r.className = 'al-r'; r.setAttribute('aria-label', name);
  Object.assign(r, { type: 'range', min, max, step, defaultValue: String(init) }); r.value = String(init);
  const back = el('path', { d: arc(20, A0, A1), fill: 'none', 'stroke-width': 4 }); back.style.stroke = 'var(--l)';
  const val = el('path', { fill: 'none', 'stroke-width': 4 }); val.style.stroke = 'var(--arc)';

  const end = () => { drag = false; };

  s.addEventListener('pointermove', (e) => { if (!drag) return; if (e.buttons === 0 || !s.hasPointerCapture(e.pointerId)) { drag = false; return; } const f = Math.max(0, Math.min(1, sf + (sy - e.clientY) / (e.shiftKey ? 800 : 160))); const v = min + Math.round(f * (max - min) / step) * step; if (v !== Number(r.value)) { r.value = String(v); r.oninput(); } });
  s.addEventListener('pointerup', end); s.addEventListener('pointercancel', end); s.addEventListener('lostpointercapture', end); window.addEventListener('blur', end);

function group(name, ...els) { const g = div('al-seg'), c = div('al-cap'), w = div('al-row'); c.textContent = name; w.append(...els); g.append(c, w); return g; }
function key(label, on) { const b = document.createElement('button'); b.className = 'al-b'; b.textContent = label; b.onclick = () => on(b); return b; }
function choice(name, opts, init, on) { let cur = init; const ks = opts.map((o, i) => { const k = key(o, () => { cur = i; mark(); on(i); }); return k; }); const mark = () => ks.forEach((k, i) => k.setAttribute('aria-pressed', String(i === cur))); mark(); const g = group(name, ...ks); g.setAttribute('role', 'group'); g.setAttribute('aria-label', name); g.set = (i) => { cur = i; mark(); }; return g; }

// ---- Slide 4: basic waveforms ----
function wave(ty, t) { const p = ((t % 1) + 1) % 1; if (ty === 0) return Math.sin(2 * Math.PI * t); if (ty === 1) return 2 * p - 1; if (ty === 2) return p < 0.5 ? 1 : -1; return 1 - 4 * Math.abs(p - 0.5); }
