// ---- Slide 2: an oscillator drives a speaker cone ----
function wave(ty, t) { const p = ((t % 1) + 1) % 1; if (ty === 0) return Math.sin(2 * Math.PI * t); if (ty === 1) return 2 * p - 1; if (ty === 2) return p < 0.5 ? 1 : -1; return 1 - 4 * Math.abs(p - 0.5); }
